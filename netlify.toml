[[headers]]
  for = "/"
  [headers.values]
    # Netlify documents this CSP as an opt-out for its injected badge.
    # The landing page runs only the compiled, same-origin application scripts.
    Content-Security-Policy = "script-src 'self'"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=()"
