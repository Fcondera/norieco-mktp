# Independent marketplace deployment; management/catalogs stay on their own site.
[build]
  command = "node scripts/netlify-build.mjs"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[redirects]]
  from = "https://www.norieco.com.br/*"
  to = "https://norieco.com.br/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/flutter_service_worker.js"
  to = "/reset-legacy-worker.js"
  status = 200
  force = true
# Public catalogs reuse the shared Flutter build, with HTTP 200 (no redirect).
# Keep every platform root route on the React site before matching store slugs.
[[redirects]]
  from = "/marketplace"
  to = "/index.html"
  status = 200
